<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fotos - SUBSONIC Festival</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gallery-section {
            min-height: 100vh;
            padding: 100px 20px 50px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: var(--light-text);
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .gallery-header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        .gallery-header .back-button {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.8rem 2rem;
            background: rgba(0, 212, 255, 0.2);
            border: 2px solid rgba(0, 212, 255, 0.5);
            color: var(--accent-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .gallery-header .back-button:hover {
            background: rgba(0, 212, 255, 0.3);
            transform: translateX(-5px);
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .photo-card {
            position: relative;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .photo-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 50px rgba(0, 212, 255, 0.4);
        }

        .photo-image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 2rem;
            position: relative;
        }

        .photo-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.7) 100%);
            z-index: 1;
        }

        .photo-info {
            position: relative;
            z-index: 2;
            color: white;
        }

        .photo-info h3 {
            font-size: 1.3rem;
            margin-bottom: 0.3rem;
        }

        .photo-info p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Gradientes bonitos para las fotos */
        .photo-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .photo-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .photo-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .photo-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .photo-5 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .photo-6 { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); }
        .photo-7 { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
        .photo-8 { background: linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%); }
        .photo-9 { background: linear-gradient(135deg, #2e2e78 0%, #662d8c 100%); }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
        }

        .modal-image {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }

        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: rgba(0, 212, 255, 0.3);
            border: 2px solid var(--accent-color);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: rgba(0, 212, 255, 0.6);
            transform: rotate(90deg);
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 212, 255, 0.3);
            border: 2px solid var(--accent-color);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .modal-nav:hover {
            background: rgba(0, 212, 255, 0.6);
        }

        .modal-prev {
            left: -70px;
        }

        .modal-next {
            right: -70px;
        }

        @media (max-width: 768px) {
            .gallery-header h1 {
                font-size: 1.8rem;
            }

            .photos-grid {
                grid-template-columns: 1fr;
            }

            .modal-prev, .modal-next {
                display: none;
            }

            .modal-close {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Navegación -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <span class="logo-icon">🎵</span>
                <span class="logo-text">SUBSONIC</span>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item">
                    <a href="calendario.html" class="nav-link">Volver a Calendario</a>
                </li>
            </ul>
            <div class="nav-right">
                <a href="login.html" class="user-icon">👤</a>
            </div>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Sección Galería -->
    <section class="gallery-section">
        <div class="container">
            <div class="gallery-header">
                <h1 id="galleryTitle">Galería de Fotos</h1>
                <a href="calendario.html" class="back-button">← Volver al Calendario</a>
            </div>

            <div class="photos-grid" id="photosGrid"></div>
        </div>
    </section>

    <!-- Modal para ver foto completa -->
    <div class="modal" id="photoModal">
        <button class="modal-nav modal-prev" onclick="previousPhoto()">❮</button>
        <div class="modal-content">
            <div class="modal-image" id="modalImage"></div>
        </div>
        <button class="modal-close" onclick="closeModal()">✕</button>
        <button class="modal-nav modal-next" onclick="nextPhoto()">❯</button>
    </div>

    <!-- Botón Flotante de Contacto -->
    <a href="faq.html" class="floating-contact-btn" title="Preguntas Frecuentes">?</a>

    <script src="script.js"></script>
    <script>
        let currentPhotoIndex = 0;
        const photos = [
            { title: 'Escenario Principal', date: '2025' },
            { title: 'Multitud Cantando', date: '2025' },
            { title: 'Luces y Efectos', date: '2025' },
            { title: 'Artista Actuando', date: '2025' },
            { title: 'Ambiente del Evento', date: '2025' },
            { title: 'Fans Disfrutando', date: '2025' },
            { title: 'Momento Especial', date: '2025' },
            { title: 'Noche del Festival', date: '2025' },
            { title: 'General View', date: '2025' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const eventName = urlParams.get('event') || 'Galería de Fotos';
            
            document.getElementById('galleryTitle').textContent = `${eventName} - Galería de Fotos`;
            
            loadPhotos();
        });

        function loadPhotos() {
            const photosGrid = document.getElementById('photosGrid');
            photosGrid.innerHTML = photos.map((photo, index) => `
                <div class="photo-card" onclick="openModal(${index})">
                    <div class="photo-image photo-${(index % 9) + 1}">
                        <div class="photo-info">
                            <h3>${photo.title}</h3>
                            <p>${photo.date}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(index) {
            currentPhotoIndex = index;
            const modal = document.getElementById('photoModal');
            const modalImage = document.getElementById('modalImage');
            const photo = photos[index];
            
            modalImage.style.background = `linear-gradient(135deg, hsl(${Math.random() * 360}, 70%, 60%), hsl(${Math.random() * 360}, 70%, 60%))`;
            modalImage.innerHTML = `
                <div style="width: 100%; height: 100%; display: flex; align-items: flex-end; padding: 2rem; background: inherit; border-radius: 12px;">
                    <div style="color: white; z-index: 2; position: relative;">
                        <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">${photo.title}</h2>
                        <p style="font-size: 1.1rem; opacity: 0.9;">${photo.date}</p>
                    </div>
                </div>
            `;
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('photoModal').classList.remove('active');
        }

        function nextPhoto() {
            currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
            openModal(currentPhotoIndex);
        }

        function previousPhoto() {
            currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
            openModal(currentPhotoIndex);
        }

        // Cerrar modal con tecla Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowRight') nextPhoto();
            if (e.key === 'ArrowLeft') previousPhoto();
        });
    </script>
</body>
</html>
