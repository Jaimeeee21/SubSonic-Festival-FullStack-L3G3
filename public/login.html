    <!-- Contenedor de Login/Registro -->
    <section class="auth-section">

                <div id="userInfoDiv" style="display: none;">

                    <p id="userName" style="color: #00f0ff; margin: 10px 0;"></p>
                    <button onclick="handleLogout()" style="background: #ff006e; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin-top: 10px;">Cerrar Sesión</button>

    <!-- Botón Flotante de Contacto -->

    <!-- Google Sign-In Script -->
    <script>
        // Esperar a que Google se haya cargado
        window.onload = function () {
            // Esperar un poco para que Google se cargue
            setTimeout(() => {
                if (typeof google !== 'undefined') {
                    // Inicializar Google Sign-In
                    google.accounts.id.initialize({
                        client_id: '173577391295-bvsq2o87tinllnbavnolunmor3fcsg2u.apps.googleusercontent.com',
                        callback: handleCredentialResponse
                    });
                    
                    google.accounts.id.renderButton(
                        document.getElementById('googleSignInDiv'),
                        { 
                            theme: 'outline',
                            size: 'large',
                            text: 'signin_with'
                        }
                    );
                    
                    document.getElementById('googleSignInDiv').style.display = 'block';
                } else {
                    console.error('Google library no se cargó');
                }
            }, 500);
        };

        async function handleCredentialResponse(response) {
            console.log('✅ Token de Google recibido');
            
            const authManager = window.authManager;
            if (!authManager) {
                console.error('authManager no inicializado');
                return;
            }
            
            const result = await authManager.loginWithGoogle(response.credential);
            
            if (result.success) {
                console.log('✅ Login exitoso con Google');
                document.getElementById('googleSignInDiv').style.display = 'none';
                document.getElementById('userInfoDiv').style.display = 'block';
                
                const user = authManager.getUser();
                document.getElementById('userEmail').textContent = '📧 Email: ' + user.email;
                document.getElementById('userName').textContent = '👤 Usuario: ' + (user.displayName || 'Usuario');
                
                // Redirigir a la página de perfil o redirección después de 1 segundo
                setTimeout(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect');
                    window.location.href = redirect ? redirect : 'profile.html';
                }, 1000);
            } else {
                console.error('Error en login:', result.error);
                alert('Error: ' + result.error);
            }
        }

        async function handleLoginSubmit(e) {
            console.log('🟡 handleLoginSubmit EJECUTADA', e);
            if (e) e.preventDefault();
            console.log('📧 Buscando email input...');
            const email = document.getElementById('loginEmail')?.value;
            const password = document.getElementById('loginPassword')?.value;
            
            console.log('Email:', email, 'Password:', password ? '***' : 'empty');
            
            if (!email || !password) {
                alert('Por favor completa todos los campos');
                return false;
            }
            
            const authManager = window.authManager;
            const result = await authManager.loginEmail(email, password);
            
            if (result.success) {
                alert('✅ Iniciaste sesión exitosamente');
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect');
                if(redirect) {
                    window.location.href = redirect;
                } else {
                    location.reload();
                }
            } else {
                alert('❌ Error: ' + result.error);
            }
            
            return false;
        }

        async function handleRegisterSubmit(e) {
            console.log('🟡 handleRegisterSubmit EJECUTADA', e);
            if (e) e.preventDefault();
            console.log('👤 Buscando campos de registro...');
            const name = document.getElementById('registerName')?.value;
            const email = document.getElementById('registerEmail')?.value;
            const password = document.getElementById('registerPassword')?.value;
            const password2 = document.getElementById('registerPassword2')?.value;
            
            console.log('Name:', name, 'Email:', email, 'Passwords match:', password === password2);
            
            if (!name || !email || !password || !password2) {
                alert('Por favor completa todos los campos');
                return false;
            }
            
            if (password !== password2) {
                alert('Las contraseñas no coinciden');
                return false;
            }
            
            const authManager = window.authManager;
            const result = await authManager.register(email, password, name);
            
            if (result.success) {
                alert('✅ Cuenta creada exitosamente');
                location.reload();
            } else {
                alert('❌ Error: ' + result.error);
            }
            
            return false;
        }

        // Usar delegación de eventos en el contenedor raíz
        document.addEventListener('submit', function(e) {
            console.log('🔴 EVENTO SUBMIT CAPTURADO EN:', e.target);
            const form = e.target;
            
            // Detectar si es el formulario de login
            if (form.closest('#loginForm')) {
                console.log('🟢 Form submit detectado en #loginForm - PREVENIENDO');
                e.preventDefault();
                e.stopPropagation();
                handleLoginSubmit(e);
                return false;
            }
            
            // Detectar si es el formulario de registro
            if (form.closest('#registerForm')) {
                console.log('🟢 Form submit detectado en #registerForm - PREVENIENDO');
                e.preventDefault();
                e.stopPropagation();
                handleRegisterSubmit(e);
                return false;
            }
        }, true); // Captura en la fase de captura

        function toggleForms() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            if (loginForm && registerForm) {
                loginForm.classList.toggle('hidden');
                registerForm.classList.toggle('hidden');
            }
        }

        function handleLogout() {
            authManager.logout();
            location.reload();
        }
    </script>
